# .github/workflows/build-system-report.yml
#
# Everglades System Conditions Report — Quarto site (SystemReport repo).
#
# Pipeline: fetch (all network I/O) -> process -> render per-page -> commit.
# Design points:
#   * Each stage is its own step: failures are attributable at a glance.
#   * The fetch manifest uploads on EVERY run, success or failure.
#   * Pages render individually with failure tolerance: a broken WCAs.qmd
#     logs a warning and the previously committed WCAs.html stays live,
#     while every other page updates normally. Hard failure only if
#     index.qmd breaks or nothing renders.
#   * TZ pinned — runners are UTC; without this, evening runs compute
#     YEST off by one and every 'Date == YEST' derived value shifts.
#   * REQUIRES: _quarto.yml with `output-dir: docs` (committed site), and
#     GitHub Pages configured to serve from main:/docs.

name: Build System Report

on:
  push:
  schedule:
    - cron: "30 10 * * *"        # 10:30 UTC = 6:30 ET (EDT) / 5:30 ET (EST)
  workflow_dispatch:
    inputs:
      full_render:
        description: "Render entire site (required after _quarto.yml / sidebar changes)"
        type: boolean
        default: false

# Never let a manual run overlap the scheduled one — both push to main.
concurrency:
  group: system-report-build
  cancel-in-progress: false

env:
  TZ: America/New_York
  # FRESHNESS_STRICT: "false"      # "true" -> fetch step aborts when key gauges are stale

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: write            # push rendered docs/ + updated accumulators
    defaults:
      run:
        shell: bash              # <- critical on Windows runners

    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true  # binary CRAN packages -> fast installs

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.6.42"      # PIN to match `quarto --version` locally.
                                 # (Draft site was built with 1.3.450 — update
                                 # locally first, then keep the two in sync.)

      # Reads DESCRIPTION at repo root: CRAN deps, the two SwampThingPaul/*
      # GitHub remotes, and Ubuntu system libs for sf/terra (GDAL/GEOS/PROJ).
      - uses: r-lib/actions/setup-r-dependencies@v2
        env:
          GITHUB_PATH: ${{ secrets.GITHUB_TOKEN }}
        with:
          cache-version: 1

      # HAB GeoTIFFs accumulate; cache them instead of committing.
      # Unique key + restore-keys prefix = always restore newest, always
      # save an updated copy at job end.
      # - name: Restore HAB raster cache
      #   uses: actions/cache@v4
      #   with:
      #     path: RSdata
      #     key: rsdata-${{ github.run_id }}
      #     restore-keys: |
      #       rsdata-

      # Stage 1 — data acquisition (the ONLY step that touches the network)
      - name: Fetch data
        shell: Rscript {0}
        run: source("src/01_fetch_data.R")

      - name: Upload fetch manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-manifest-${{ github.run_number }}
          path: data/raw/fetch_manifest.csv
          if-no-files-found: ignore
          retention-days: 14

      - name: Render site
        shell: cmd
        run: quarto render

      # publish _site to the gh-pages branch.
      # render: false because already rendered; keeping them
      # separate keeps failures attributable (render bug vs push/auth bug).

      - name: Publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # PUBLISH — same two options as before:
      #   (A) gh-pages branch:  quarto publish gh-pages --no-render --no-browser
      #   (B) output-dir docs + Pages "master /docs": swap _site for docs
      # - name: Commit rendered site
      #   run: |
      #     git config core.autocrlf input          # <- prevents CRLF churn
      #     git config user.name  "github-actions[bot]"
      #     git config user.email "github-actions[bot]@users.noreply.github.com"
      #     git add _site plots
      #     git diff --cached --quiet || git commit -m "Daily report $(date +'%Y-%m-%d %H:%M %Z')"
      #     git push

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_number }}
          path: |
            *.log
          if-no-files-found: ignore
