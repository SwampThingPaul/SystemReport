name: Render and Deploy Quarto Site

on:
  push:
  schedule:
  # Runs every day at 12:30 AM UTC (0830 EST)
    - cron: "30 12 * * *"

permissions:
  contents: write  # allows committing rendered files
  
jobs:
  render:
    name: Render report
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.Rlibrary
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
          r-version: '4.2.0' 
          
    - name: Setup Quarto
      uses: quarto-dev/quarto-actions/setup@v2

    - name: Install system dependencies for sf/terra
      run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libudunits2-dev
            
    - name: Cache R packages
      uses: actions/cache@v3
      with:
        path: ${{ env.R_LIBS_USER }}
        key: ${{ runner.os }}-R-${{ hashFiles('**/*.R', '**/*.Rmd') }}
        restore-keys: |
          ${{ runner.os }}-r-

    - name: Install R packages (CRAN + GitHub)
      run: |
          Rscript -e 'install.packages(c("remotes","reshape2","plyr","zoo",
          "RcppRoll","dataRetrieval","downloadthis","rvest","httr",
          "mapmisc","future","future.apply","flextable","ggplot2", "sf", "raster",
          "terra"), repos = "https://cloud.r-project.org")'

          Rscript -e 'install.packages("remotes")'
          Rscript -e 'remotes::install_github(SwampThingPaul/AnalystHelper")'  # replace with your GitHub package
          Rscript -e 'remotes::install_github(SwampThingPaul/EVERSpatDat")'  # replace with your GitHub package

    - name: Render Quarto project
      run: quarto render
        
    - name: Commit and push changes
      run: |
          git config user.name "SwampThingPaul"
          git config user.email "<>"
          git add -A
          git commit -m "Auto render site $(date -u +'%Y-%m-%d')" || echo "No changes to commit"
          git push
          
    - name: Publish Quarto site to GitHub Pages
      uses: quarto-dev/quarto-actions/publish@v2
      with:
        target: gh-pages