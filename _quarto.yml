project:
  type: website
  render: 
    # - "*.qmd"
    # - "!archive/"
    - index.qmd
    - LOK.qmd
    # - WCAs.qmd
    # - EAA.qmd
    # - STAs.qmd
    # - ENP.qmd
    - Estuaries.qmd
    # - habs.qmd
    - 404.qmd
    - enso.qmd
    - WLCon.qmd
    - datProc.qmd
    
execute:
  freeze: false          # default: data pages re-execute every run
  echo: false
  warning: false
  message: false         # (also silences the `[1] 1 [1] 2 ...` loop output
                         #  currently visible on the live LOK.html draft —
                         #  though drop the stray print() too)

website:
  title: "Everglades System Conditions Report"
  navbar:
    tools:
      - icon: github
        menu:
          - text: Source Code
            href: https://github.com/SwampThingPaul/SystemReport
          - text: Report a Bug
            href: https://github.com/SwampThingPaul/SystemReport/issues
          - text: Everglades Foundation
            href: https://www.evergladesfoundation.org/
    left:
      - href: index.qmd
        text: Home
  sidebar:
    style: "docked"
    search: true
    contents: 
      - href: 404.qmd # KCOL.qmd
        text: Kissimmee Chain of Lakes
      - href: 404.qmd # KRR.qmd
        text: Kissimmee River
      - href: LOK.qmd 
        text: Lake Okeechobee
      - href: Estuaries.qmd
        text: Northern Estuaries
     # - href: 404.qmd # habs.qmd
     #   text: HABs (Redtide and Cyano)
      - href: 404.qmd # EAA.qmd
        text: EAA
      - href: 404.qmd # STAs.qmd
        text: STAs
      - href: 404.qmd # WCAs.qmd
        text: WCAs
      - href: 404.qmd # ENP.qmd
        text: ENP
      - href: enso.qmd
        text: Climate Information
      - href: WLCon.qmd
        text: Stage Datum
      # - href: datProc.qmd
      #   text: Data Source and Info
  page-footer: 
   border: true
   left: "Published with [Quarto](https://quarto.org/)"
   right: "[The Everglades Foundation](https://www.evergladesfoundation.org/)"

format:
  html:
    grid:
      sidebar-width: 400px
      margin-width: 275px
      gutter-width: 1em
    page-layout: full
    theme: cosmo
    css: styles.css
    toc: false



